<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doctor Form - Hospital Management</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f8fb;
            color: #172b4d;
            min-height: 100vh;

            /* Keep footer at bottom */
            display: flex;
            flex-direction: column;
        }


        /* ================= HEADER ================= */

        .header {
            height: 82px;
            background: #092b49;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 5%;

            border-bottom: 4px solid #18b7a0;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);

            flex-shrink: 0;
        }


        /* ================= LOGO ================= */

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;

            background: white;
            color: #0da99a;

            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 25px;
            font-weight: bold;
        }

        .logo-text {
            color: white;
            font-size: 23px;
            font-weight: 700;
        }

        .logo-text span {
            color: #20c4ae;
        }


        /* ================= NAVIGATION ================= */

        .nav {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav a {
            text-decoration: none;
            color: #dce8f2;

            padding: 11px 17px;

            border-radius: 8px;

            font-size: 14px;
            font-weight: 600;

            transition: 0.3s;
        }

        .nav a:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .nav .active {
            background: #0da99a;
            color: white;
        }


        /* ================= PAGE ================= */

        .page {
            width: 92%;
            max-width: 1100px;

            margin: 45px auto 70px;

            /* Push footer to bottom */
            flex: 1;
        }


        /* ================= FORM CONTAINER ================= */

        .form-container {
            background: white;

            border-radius: 16px;

            padding: 40px 50px;

            box-shadow: 0 8px 30px rgba(20, 50, 80, 0.10);

            border: 1px solid #e4ebf1;
        }


        /* ================= TITLE ================= */

        .form-heading {
            text-align: center;
            margin-bottom: 35px;
        }

        .form-heading h1 {
            font-size: 32px;
            color: #102f4d;
            margin-bottom: 8px;
        }

        .form-heading p {
            color: #718096;
            font-size: 14px;
        }

        .title-line {
            width: 55px;
            height: 4px;

            background: #18b7a0;

            border-radius: 10px;

            margin: 14px auto 0;
        }


        /* ================= FORM GRID ================= */

        .form-grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 24px 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 8px;

            font-size: 14px;
            font-weight: 700;

            color: #344e68;
        }

        input,
        select {
            width: 100%;
            height: 48px;

            padding: 0 14px;

            border: 1px solid #d4dee7;

            border-radius: 8px;

            font-size: 14px;

            font-family: inherit;

            color: #263b53;

            background: #fbfdff;

            transition: 0.2s;
        }

        input::placeholder {
            color: #9aa9b8;
        }

        input:hover,
        select:hover {
            border-color: #9bb8c4;
        }

        input:focus,
        select:focus {
            outline: none;

            border: 2px solid #18a99a;

            background: white;

            box-shadow: 0 0 0 3px rgba(24, 183, 160, 0.10);
        }


        /* ================= BUTTONS ================= */

        .button-section {
            margin-top: 38px;

            padding-top: 25px;

            border-top: 1px solid #e8eef3;

            text-align: center;
        }

        .save-btn {
            min-width: 260px;

            height: 48px;

            border: none;

            border-radius: 8px;

            background: #0da99a;

            color: white;

            font-size: 15px;

            font-family: inherit;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;

            box-shadow: 0 5px 15px rgba(13, 169, 154, 0.22);
        }

        .save-btn:hover {
            background: #078c80;

            transform: translateY(-2px);

            box-shadow: 0 8px 20px rgba(13, 169, 154, 0.28);
        }

        .back-btn {
            display: block;

            margin-top: 18px;

            color: #0b7f82;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;
        }

        .back-btn:hover {
            color: #075c60;

            text-decoration: underline;
        }


        /* ================= FOOTER ================= */

        .footer {
            background: #092b49;

            border-top: 4px solid #18b7a0;

            color: #d9e5ee;

            text-align: center;

            padding: 24px 15px;

            font-size: 13px;

            /* Keep footer at bottom */
            margin-top: auto;

            flex-shrink: 0;
        }

        .footer-main {
            margin-bottom: 7px;
        }

        .footer-sub {
            color: #20c4ae;

            font-size: 12px;
        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 850px) {

            .header {
                height: auto;

                padding: 18px 5%;

                flex-direction: column;

                gap: 15px;
            }

            .nav {
                flex-wrap: wrap;

                justify-content: center;
            }

            .page {
                width: 95%;

                margin-top: 30px;
            }

            .form-container {
                padding: 35px 30px;
            }
        }


        @media (max-width: 650px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-container {
                padding: 30px 22px;
            }

            .form-heading h1 {
                font-size: 27px;
            }

            .save-btn {
                width: 100%;
            }
        }


        @media (max-width: 500px) {

            .logo-text {
                font-size: 18px;
            }

            .nav a {
                padding: 8px 10px;

                font-size: 12px;
            }
        }

    </style>

</head>


<body>


    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="logo">

            <div class="logo-icon">
                ✚
            </div>

            <div class="logo-text">
                HOSPITAL <span>MANAGEMENT SYSTEM</span>
            </div>

        </div>


        <nav class="nav">

            <a href="/">
                🏠 Dashboard
            </a>

            <a href="/doctors" class="active">
                👨‍⚕️ Doctors
            </a>

            <a href="/patients">
                👤 Patients
            </a>

            <a href="/appointments">
                📅 Appointments
            </a>

        </nav>

    </header>



    <!-- ================= PAGE ================= -->

    <main class="page">

        <div class="form-container">


            <!-- ================= FORM HEADING ================= -->

            <div class="form-heading">

                <h1>
                    👨‍⚕️ Doctor Details
                </h1>

                <p>
                    Enter the doctor's professional and contact information
                </p>

                <div class="title-line"></div>

            </div>



            <!-- ================= FORM ================= -->

            <form
                th:action="@{/doctors/save}"
                th:object="${doctor}"
                method="post">


                <!-- ================= IMPORTANT: KEEP ID FOR EDIT ================= -->

                <input type="hidden" th:field="*{id}">



                <div class="form-grid">


                    <!-- ================= DOCTOR NAME ================= -->

                    <div class="form-group">

                        <label>
                            Doctor Name
                        </label>

                        <input
                            type="text"
                            th:field="*{name}"
                            placeholder="Enter doctor name"
                            required>

                    </div>



                    <!-- ================= SPECIALIZATION ================= -->

                    <div class="form-group">

                        <label>
                            Specialization
                        </label>

                        <select
                            th:field="*{specialization}"
                            required>

                            <option value="">
                                -- Select Specialization --
                            </option>

                            <option value="Cardiology">
                                Cardiology
                            </option>

                            <option value="Neurology">
                                Neurology
                            </option>

                            <option value="Orthopedics">
                                Orthopedics
                            </option>

                            <option value="Dermatology">
                                Dermatology
                            </option>

                            <option value="Pediatrics">
                                Pediatrics
                            </option>

                            <option value="General Medicine">
                                General Medicine
                            </option>

                            <option value="ENT">
                                ENT
                            </option>

                            <option value="Dentistry">
                                Dentistry
                            </option>

                        </select>

                    </div>



                    <!-- ================= DEPARTMENT ================= -->

                    <div class="form-group">

                        <label>
                            Department
                        </label>

                        <select
                            th:field="*{department}"
                            required>

                            <option value="">
                                -- Select Department --
                            </option>

                            <option value="Cardiology Department">
                                Cardiology Department
                            </option>

                            <option value="Neurology Department">
                                Neurology Department
                            </option>

                            <option value="Orthopedics Department">
                                Orthopedics Department
                            </option>

                            <option value="Dermatology Department">
                                Dermatology Department
                            </option>

                            <option value="Pediatrics Department">
                                Pediatrics Department
                            </option>

                            <option value="General Medicine Department">
                                General Medicine Department
                            </option>

                            <option value="Emergency Department">
                                Emergency Department
                            </option>

                            <option value="ENT Department">
                                ENT Department
                            </option>

                            <option value="Dental Department">
                                Dental Department
                            </option>

                        </select>

                    </div>



                    <!-- ================= PHONE ================= -->

                    <div class="form-group">

                        <label>
                            Phone
                        </label>

                        <input
                            type="text"
                            th:field="*{phone}"
                            placeholder="Enter phone number"
                            required>

                    </div>



                    <!-- ================= EMAIL ================= -->

                    <div class="form-group">

                        <label>
                            Email
                        </label>

                        <input
                            type="email"
                            th:field="*{email}"
                            placeholder="Enter email address"
                            required>

                    </div>



                    <!-- ================= SHIFT ================= -->

                    <div class="form-group">

                        <label>
                            Shift Timing
                        </label>

                        <select
                            th:field="*{shiftTiming}"
                            required>

                            <option value="">
                                -- Select Shift --
                            </option>

                            <option value="Morning (6 AM - 12 PM)">
                                Morning (6 AM - 12 PM)
                            </option>

                            <option value="Afternoon (12 PM - 6 PM)">
                                Afternoon (12 PM - 6 PM)
                            </option>

                            <option value="Evening (6 PM - 12 AM)">
                                Evening (6 PM - 12 AM)
                            </option>

                            <option value="Night (12 AM - 6 AM)">
                                Night (12 AM - 6 AM)
                            </option>

                        </select>

                    </div>



                    <!-- ================= EXPERIENCE ================= -->

                    <div class="form-group">

                        <label>
                            Experience
                        </label>

                        <input
                            type="number"
                            th:field="*{experience}"
                            placeholder="Years of experience"
                            min="0"
                            required>

                    </div>



                    <!-- ================= AVAILABILITY ================= -->

                    <div class="form-group">

                        <label>
                            Availability
                        </label>

                        <select
                            th:field="*{availability}"
                            required>

                            <option value="">
                                -- Select Availability --
                            </option>

                            <option value="Available">
                                Available
                            </option>

                            <option value="Not Available">
                                Not Available
                            </option>

                            <option value="On Leave">
                                On Leave
                            </option>

                        </select>

                    </div>


                </div>



                <!-- ================= BUTTONS ================= -->

                <div class="button-section">

                    <button
                        type="submit"
                        class="save-btn">

                        💾 Save Doctor

                    </button>


                    <a
                        href="/doctors"
                        class="back-btn">

                        ← Back to Doctor List

                    </a>

                </div>


            </form>

        </div>

    </main>



    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="footer-main">
            © 2026 Hospital Management System. All Rights Reserved.
        </div>

        <div class="footer-sub">
            Caring for Life • Committed to Excellence
        </div>

    </footer>


</body>

</html>
